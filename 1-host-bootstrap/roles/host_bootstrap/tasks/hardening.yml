---
- name: Refuse to harden SSH without an admin key (lock-out guard)
  ansible.builtin.assert:
    that: host_admin_authorized_keys | length > 0
    fail_msg: "Set host_admin_authorized_keys, or host_ssh_harden=false"
  when: host_ssh_harden

- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git, ufw, unattended-upgrades, apt-listchanges, rsync, jq, zstd, acl, iptables]
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ host_timezone }}"

- name: Create admin user
  ansible.builtin.user:
    name: "{{ host_admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true

- name: Install admin authorized keys
  ansible.posix.authorized_key:
    user: "{{ host_admin_user }}"
    key: "{{ item }}"
    exclusive: false
  loop: "{{ host_admin_authorized_keys }}"

- name: Allow passwordless sudo for the admin user (key-only login)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ host_admin_user }}"
    content: "{{ host_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-heldengilde.conf
    mode: "0644"
    content: |
      Port {{ host_ssh_port }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
      AllowAgentForwarding no
    validate: sshd -t -f %s
  when: host_ssh_harden
  notify: Restart sshd

- name: Kernel network hardening
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-heldengilde.conf
    mode: "0644"
    content: |
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
  notify: Apply sysctl

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52heldengilde-unattended
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if host_unattended_reboot else 'false' }}";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Enable periodic upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
  when: host_fail2ban

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/heldengilde.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = {{ host_ssh_port }}
      backend = systemd
      maxretry = 4
      bantime = 1h
  when: host_fail2ban
  notify: Restart fail2ban
