name: validate

# CI only validates; it never deploys (ADR 0003). Actions are pinned to commit SHAs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install linters
        run: |
          pipx install yamllint==1.38.0
          pipx install --include-deps ansible-lint==26.4.0
          ansible-galaxy collection install -r 3-ansible/requirements.yml
      - name: Repo checks
        run: local/lint.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose

  boot-test:
    # Boots the real server definition (16 of 17 plugins: the premium MythicDungeons jar
    # is not available in CI, ADR 0005) and fails on plugin load errors.
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Boot test
        run: local/boot-test.sh
        env:
          HG_BOOT_DIR: ${{ runner.temp }}/boottest
      - name: Upload boot log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boot-log
          path: ${{ runner.temp }}/boottest/boot.log
          retention-days: 7
