---
- name: Create the Minecraft server (egg, allocation, server, mounts)
  ansible.builtin.command: "{{ hg_root }}/gitops/scripts/provision-server.sh"
  environment:
    COMPOSE_FILE: "{{ hg_root }}/panel/compose.yml"
    STATE_DIR: "{{ hg_root }}/state"
    PANEL_URL: http://127.0.0.1:8081
    PANEL_HOST: "{{ hg_panel_domain }}"
    SERVER_NAME: "{{ hg_server_name }}"
    SERVER_PORT: "{{ hg_server_port }}"
    VOICE_PORT: "{{ hg_voice_port }}"
    BEDROCK_PORT: "{{ hg_bedrock_port }}"
    BLUEMAP_PORT: "{{ hg_bluemap_port }}"
    SERVER_MEMORY_MB: "{{ hg_server_memory_mb }}"
    SERVER_DISK_MB: "{{ hg_server_disk_mb }}"
    VOLUMES_DIR: "{{ hg_volumes_dir }}"
    GITOPS_SRC: "{{ hg_root }}/gitops"
    JARS_SRC: "{{ hg_root }}/custom-jars"
    CONFIG_SRC: "{{ hg_root }}/gitops/4-server/config"
    EXTRA_ENV_JSON: "{{ hg_server_extra_env | default({}) | to_json }}"
  register: hg_provision
  no_log: true
  when: hg_provision_server
  changed_when: "'importing egg' in hg_provision.stdout or 'updating egg' in hg_provision.stdout or 'adding allocations' in hg_provision.stdout or 'server id' in hg_provision.stdout"
