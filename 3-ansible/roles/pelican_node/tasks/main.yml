---
- name: Read the node configuration generated by the panel
  ansible.builtin.slurp:
    src: "{{ hg_root }}/state/wings-config.yml"
  register: hg_wings_raw
  no_log: true

- name: Write the Wings config
  ansible.builtin.copy:
    dest: /etc/pelican/config.yml
    mode: "0600"
    content: >-
      {{ (hg_wings_raw.content | b64decode | from_yaml) | combine(hg_wings_overrides, recursive=True) | to_nice_yaml(indent=2) }}
  vars:
    hg_wings_overrides:
      # Wings talks to the panel locally; the panel and browsers reach Wings through Caddy.
      remote: http://127.0.0.1:8081
      api:
        host: 127.0.0.1
        port: 8080
        ssl:
          enabled: false
      allowed_mounts:
        - "{{ hg_root }}/gitops"
        - "{{ hg_root }}/gitops/4-server/config"
        - "{{ hg_root }}/custom-jars"
        - "{{ hg_volumes_dir }}"
  no_log: true
  notify: Restart wings

- name: Start Wings
  ansible.builtin.systemd:
    name: wings
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers so Wings runs with the final config
  ansible.builtin.meta: flush_handlers
